version: "1"
projects:
- name: Chat_app
  environments:
  - name: Production
    databases:
    - name: chat-app-db
      databaseName: chat_app_production
      user: chat_app_user
      plan: free
      region: oregon
      postgresMajorVersion: "18"

    services:
    - type: web
      name: chat-app-2
      runtime: docker
      region: oregon
      plan: free
      envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-app-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
