# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: cheat_app_development
  host: localhost
  username: postgres
  password: password

test:
  <<: *default
  database: cheat_app_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>